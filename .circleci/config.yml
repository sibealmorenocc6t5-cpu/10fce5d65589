      - run:
          name: Merge LoRA adapters
          command: LIONSS_LP=1 ./build/loraMerge --list adapters.txt --alpha 0.5
  voxel-remesh:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
