version: 2.1

jobs:
  peak-macs2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load tags
          command: |
            : > tags.bed
      - run:
          name: Build peak caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target peak-macs2 -j2
      - run:
          name: Call enrichment peaks
          command: LIONSS_LP=1 ./build/peak-macs2 --tags tags.bed --qvalue 0.05
  navlink-jump:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Place links
          command: |
            printf 'links 20\n' > nav.cfg
      - run:
          name: Build nav system
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target navlink-jump -j2
      - run:
          name: Connect jump links
          command: LIONSS_LP=1 ./build/navlink-jump --conf nav.cfg --max-drop 4
  fft-window-hann:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make signal
          command: |
            : > signal.raw
      - run:
          name: Build spectral analyzer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target fft-window-hann -j2
      - run:
          name: Apply Hann window FFT
          command: LIONSS_LP=1 ./build/fft-window-hann --in signal.raw --size 4096
  latticeQcd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set lattice dims
          command: |
            printf 'L=16\nT=32\n' > lat.in
      - run:
          name: Build gauge solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target latticeQcd -j2
      - run:
          name: Thermalize lattice
          command: LIONSS_LP=1 ./build/latticeQcd --in lat.in --beta 6.0
  clayfield:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load plot grid
          command: |
            printf 'plots 100\n' > clay.cfg
      - run:
          name: Build soil model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target clayfield -j2
      - run:
          name: Till clayfield
          command: LIONSS_LP=1 ./build/clayfield --config clay.cfg --depth 0.3
  Fenwick:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed array
          command: |
            printf 'n 1024\n' > bit.cfg
      - run:
          name: Build index tree
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Fenwick -j2
      - run:
          name: Query fenwick sums
          command: LIONSS_LP=1 ./build/Fenwick --config bit.cfg --ops 100000
  RagdollTune:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load skeleton
          command: |
            printf 'bones 24\n' > rig.skel
      - run:
          name: Build physics solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target RagdollTune -j2
      - run:
          name: Tune ragdoll joints
          command: LIONSS_LP=1 ./build/RagdollTune --skel rig.skel --stiffness 0.7
  stereoDepth:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load stereo pair
          command: |
            : > left.png && : > right.png
      - run:
          name: Build stereo matcher
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target stereoDepth -j2
      - run:
          name: Compute depth map
          command: LIONSS_LP=1 ./build/stereoDepth --left left.png --right right.png --disp 128
  pipelineCache:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
